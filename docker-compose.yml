# Local development stack: postgres + optional app container.
# For daily dev you usually only need:  docker compose up -d postgres
# then: npm run db:migrate && npm run dev:server && npm run dev:web
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: railway
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  # full app (server + built web) — handy for a production-like local run
  app:
    build: .
    profiles: ['full']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/railway
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://your-project.livekit.cloud}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      REGISTRATION_MODE: invite
      INVITE_CODE: ${INVITE_CODE:-DEVINVITE1}
      UPLOAD_DIR: /data/uploads
      MAX_CONCURRENT_RADIOS: 2
      RADIO_MODE: auto
    ports:
      - '3000:3000'
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
